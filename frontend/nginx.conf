server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app is built with an empty VITE_API_BASE_URL, so the bundle asks for
    # /api, /uploads and /ws on its own origin. Everything below forwards
    # those to the backend container, which is what makes the whole app
    # same-origin: no CORS preflights, and the session cookie is first-party.
    #
    # "backend" is the service name in docker-compose.yml; Docker's embedded
    # DNS resolves it on the shared network.

    # The JSON API.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avatars and post images are posted here as multipart bodies, and
        # nginx's 1m default is smaller than what pkg/auth and pkg/posts
        # accept. Let the backend be the one that decides a file is too big,
        # so the error comes back as the app's own message rather than
        # nginx's 413 page.
        client_max_body_size 25m;
    }

    # Uploaded avatars and post images. Needed, not optional: utils/display.js
    # builds these URLs as `${BASE_URL}${path}`, and with BASE_URL empty that
    # is a relative /uploads/... against this origin. Without this block the
    # SPA fallback below would answer every image with index.html.
    location /uploads/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The WebSocket. stores/websocket.js has always dialled
    # `${protocol}//${window.location.host}/ws`, which is this origin, so
    # without this block the handshake fell through to the SPA fallback and
    # got index.html with a 200 instead of a 101.
    #
    # Exact match: /ws is the only path, and it must not shadow anything else.
    location = /ws {
        proxy_pass http://backend:8080;

        # An upgrade is an HTTP/1.1 conversation; nginx talks 1.0 upstream by
        # default, which cannot carry one.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # pkg/websocket's CheckOrigin compares this against ALLOWED_ORIGIN,
        # so it has to arrive unaltered.
        proxy_set_header Origin            $http_origin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The connection is idle between pushes and lives as long as the tab
        # does. The 60s default would drop it roughly once a minute and leave
        # the client reconnecting forever.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Nothing to buffer on a stream, and buffering delays pushes.
        proxy_buffering off;
    }

    location / {
        # SPA fallback so refreshing on e.g. /groups/3 doesn't 404
        try_files $uri $uri/ /index.html;
    }
}
